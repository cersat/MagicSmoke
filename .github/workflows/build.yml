name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VER=$VER" >> "$GITHUB_ENV"
          if gh release view "v$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиз v$VER уже есть — подними versionName"; exit 1
          fi

      # APK для GitHub (без рекламы)
      - name: Build APK
        run: ./gradlew assembleGithubRelease

      # AAB для Google Play (с рекламой) — только когда заданы ID рекламы
      - name: Build Play AAB
        id: aab
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          if [ -n "$ADMOB_APP_ID" ] && [ -n "$ADMOB_REWARDED_ID" ]; then
            ./gradlew bundlePlayRelease
            echo "built=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Play AAB
        if: steps.aab.outputs.built == '1'
        uses: actions/upload-artifact@v4
        with:
          name: magicsmoke-play-aab-${{ env.VER }}
          path: app/build/outputs/bundle/playRelease/*.aab

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk "MagicSmoke-$VER.apk"
          gh release create "v$VER" "MagicSmoke-$VER.apk" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Magic Smoke $VER" --generate-notes
